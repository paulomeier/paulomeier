name: Partes dinâmicas do perfil

on:
  schedule:
    - cron: "*/5 * * * *"    # Discord a cada 5 min; o resto muda a cada hora
  workflow_dispatch:          # permite rodar manualmente
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Gerar cobrinha, arte ASCII, galeria e card do Discord
        run: python3 .github/scripts/gerar.py

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
