name: Partes dinâmicas do perfil

on:
  schedule:
    - cron: "0 * * * *"      # sorteia tudo de novo a cada hora
  workflow_dispatch:          # permite rodar manualmente
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Gerar cobrinha, frase do Robux, arte ASCII e galeria
        run: python3 .github/scripts/gerar.py

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
